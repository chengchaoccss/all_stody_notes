[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-assertion"
version = "0.1.0"
description = "Video AI assertion pipeline using Volcengine Doubao multimodal model"
requires-python = ">=3.10"
dependencies = [
  "opencv-python-headless>=4.9",
  "scenedetect>=0.6.4",
  "imagehash>=4.3",
  "Pillow>=10.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "pydantic>=2.6",
  "Jinja2>=3.1",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.scripts]
video-assertion-server = "video_assertion.server.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"video_assertion.server" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
